<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1714"/>
      <stop offset="1" stop-color="#05231b"/>
    </linearGradient>
    <linearGradient id="z" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cinematic badge -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Bold Z mark with an integrated play triangle in the counter -->
  <g filter="url(#glow)">
    <g fill="url(#z)">
      <!-- top bar -->
      <path d="M150 150 h212 a10 10 0 0 1 10 10 v34 a10 10 0 0 1 -10 10 h-212 a10 10 0 0 1 -10 -10 v-34 a10 10 0 0 1 10 -10 z"/>
      <!-- bottom bar -->
      <path d="M150 308 h212 a10 10 0 0 1 10 10 v34 a10 10 0 0 1 -10 10 h-212 a10 10 0 0 1 -10 -10 v-34 a10 10 0 0 1 10 -10 z"/>
      <!-- diagonal stroke connecting the two bars -->
      <path d="M330 194 l42 0 -190 124 -42 0 z"/>
    </g>
    <!-- play triangle accent, top-right counter of the Z -->
    <path d="M300 232 l0 44 38 -22 z" fill="#04120c" opacity="0.9"/>
  </g>
</svg>
